<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doa+ - Doações</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <strong>Doa+</strong>
    <nav><a href="dashboard.html">Painel</a><a href="doacoes.html">Doações</a><span id="saudacao"></span><a href="#" id="btn-sair">Sair</a></nav>
  </header>
  <main>
    <div id="msg" class="msg"></div>

    <!-- Formulário: visível somente para doador (a API também exige esse perfil) -->
    <div class="card" id="card-form" style="display:none">
      <h2 id="titulo-form">Nova doação</h2>
      <form id="form-doacao">
        <div class="linha">
          <div><label for="titulo">Título</label><input id="titulo" required minlength="3" maxlength="120"></div>
          <div><label for="categoria_id">Categoria</label><select id="categoria_id" required></select></div>
        </div>
        <div class="linha">
          <div><label for="quantidade">Quantidade</label><input id="quantidade" type="number" step="0.01" min="0.01" required></div>
          <div><label for="unidade">Unidade</label><input id="unidade" placeholder="kg, un, L..." required></div>
          <div><label for="data_validade">Validade</label><input id="data_validade" type="date" required></div>
        </div>
        <label for="local_retirada">Local de retirada</label>
        <input id="local_retirada" required>
        <label for="descricao">Descrição (opcional)</label>
        <input id="descricao">
        <button type="submit" id="btn-salvar">Cadastrar doação</button>
        <button type="button" id="btn-cancelar-edicao" class="secundario" style="display:none">Cancelar edição</button>
      </form>
    </div>

    <div class="card">
      <div class="filtros">
        <div><label for="f-busca">Buscar</label><input id="f-busca" placeholder="Título..."></div>
        <div><label for="f-categoria">Categoria</label><select id="f-categoria"><option value="">Todas</option></select></div>
        <div><label for="f-status">Status</label>
          <select id="f-status">
            <option value="">Todos</option><option value="disponivel">Disponível</option>
            <option value="reservada">Reservada</option><option value="concluida">Concluída</option>
          </select>
        </div>
        <button id="btn-filtrar">Filtrar</button>
      </div>
    </div>

    <div id="lista"></div>
  </main>
  <script src="../js/api.js"></script>
  <script src="../js/doacoes.js"></script>
</body>
</html>
