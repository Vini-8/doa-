<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doa+ - Painel</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <strong>Doa+</strong>
    <nav><a href="dashboard.html">Painel</a><a href="doacoes.html">Doações</a><span id="saudacao"></span><a href="#" id="btn-sair">Sair</a></nav>
  </header>
  <main>
    <div class="card">
      <h2>Painel</h2>
      <p id="descricao"></p>
    </div>

    <div class="resumo">
      <div class="item"><strong id="r-disponivel">0</strong>Disponíveis</div>
      <div class="item"><strong id="r-reservada">0</strong>Reservadas</div>
      <div class="item"><strong id="r-concluida">0</strong>Concluídas</div>
    </div>

    <!-- Visível apenas para admin (a API também bloqueia os demais perfis) -->
    <div class="card" id="area-admin" style="display:none">
      <h3>Usuários</h3>
      <table>
        <thead><tr><th>Nome</th><th>Email</th><th>Perfil</th><th>Status</th><th>Ação</th></tr></thead>
        <tbody id="tabela-usuarios"></tbody>
      </table>
      <div id="msg" class="msg"></div>
    </div>
  </main>
  <script src="../js/api.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
